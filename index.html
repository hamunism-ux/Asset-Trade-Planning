<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta name="theme-color" content="#1f2328">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="買賣與掛單">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>資產買賣紀錄與掛單規劃本 Asset Trade & Ladder Planner</title>
<style>
  :root {
    --plane: #f4f3ef; --card: #ffffff; --surface: #fcfcfb;
    --ink: #1f2328; --ink2: #52514e; --muted: #898781; --line: #e1e0d9; --line2: #efeee9;
    --accent: #2a78d6; --accent-ink: #1c5cab; --accent-wash: #eaf2fc;
    --filled: #898781; --placed: #1baf7a; --plan: #eda100; --paused: #d4d2ca;
    --filled-bg: #ecebe7; --placed-bg: #dcf3ea; --plan-bg: #fff6d9;
    --good: #006300; --bad: #b3261e; --bad-bg: #fdecea; --warn: #9a5b00; --warn-bg: #fff4e5;
    --r: 10px;
    --font: system-ui, -apple-system, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--plane); color: var(--ink); font: 13.5px/1.5 var(--font); -webkit-text-size-adjust: 100%; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent-ink); }
  .num { font-variant-numeric: tabular-nums; }

  /* top bar */
  header.top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px; padding: 0 16px;
    height: 54px; background: var(--card); border-bottom: 1px solid var(--line); }
  .brand { font-weight: 750; font-size: 15px; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  .brand i { width: 10px; height: 10px; border-radius: 3px; background: var(--plan); display: inline-block; box-shadow: 12px 0 0 var(--placed); margin-right: 12px; }
  nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; }
  nav::-webkit-scrollbar { display: none; }
  nav button { border: 0; background: none; padding: 7px 11px; border-radius: 7px; cursor: pointer; color: var(--ink2); white-space: nowrap; }
  nav button:hover { background: var(--plane); }
  nav button.on { background: var(--ink); color: #fff; }
  .tools { display: flex; gap: 8px; align-items: center; }
  .tools .meta { color: var(--muted); font-size: 11.5px; white-space: nowrap; }

  main { max-width: 1320px; margin: 0 auto; padding: 16px 16px 90px; }
  h1 { font-size: 19px; margin: 2px 0 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  h1 small { font-size: 12.5px; color: var(--muted); font-weight: 400; }
  h1 .btn, h2 .btn { font-size: 13px; font-weight: 500; }
  .lg { border-radius: 50%; vertical-align: middle; flex: none; object-fit: contain; }
  .lg-b { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; color: #fff; font-weight: 700; vertical-align: middle; flex: none; line-height: 1; }
  .chipbtn .lg, .chipbtn .lg-b { margin: -2px 4px 0 -4px; }
  .acard .hd { align-items: center; }
  h2 { font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  h2 .sp, .sp { flex: 1; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
  .grid { display: grid; gap: 12px; }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .mt { margin-top: 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  /* controls */
  select, input[type=number], input[type=text], input[type=datetime-local], textarea {
    height: 32px; border: 1px solid var(--line); border-radius: 7px; background: #fff; padding: 0 9px; min-width: 0; }
  textarea { height: auto; padding: 8px 9px; width: 100%; resize: vertical; }
  select:focus, input:focus, textarea:focus { outline: 2px solid var(--accent-wash); border-color: var(--accent); }
  .btn { height: 32px; padding: 0 13px; border-radius: 7px; border: 1px solid var(--line); background: #fff; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { background: var(--plane); }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.primary:hover { background: #000; }
  .btn.danger { color: var(--bad); border-color: #f0c6c2; }
  .btn.danger:hover { background: var(--bad-bg); }
  .btn.sm { height: 27px; padding: 0 9px; font-size: 12.5px; }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn:disabled { opacity: .45; cursor: default; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
  .seg button { border: 0; background: transparent; padding: 0 12px; height: 30px; cursor: pointer; color: var(--ink2); }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--ink); color: #fff; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chipbtn { border: 1px solid var(--line); background: #fff; border-radius: 16px; padding: 3px 11px; cursor: pointer; font-size: 12.5px; color: var(--ink2); }
  .chipbtn.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .chipbtn .c { opacity: .65; margin-left: 4px; }

  /* status chips */
  .st { display: inline-flex; align-items: center; gap: 5px; padding: 0 9px; border-radius: 11px; font-size: 12px; line-height: 22px; cursor: pointer; border: 0; white-space: nowrap; }
  .st::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: currentColor; opacity: .8; }
  .st.s-plan { background: #ffe9a8; color: #7a5300; }
  .st.s-placed { background: #c4ecdc; color: #0d6b4a; }
  .st.s-filled { background: #dddcd6; color: #5d5c57; }
  .st.s-paused { background: #f1f0ec; color: #8a8984; }
  .st.s-new { background: #ffe9a8; color: #7a5300; cursor: default; }
  .hint { font-size: 12px; white-space: nowrap; }
  .hint.cross { color: var(--bad); font-weight: 650; }
  .hint.wrong { color: var(--warn); }
  .hint.near { color: var(--accent-ink); font-weight: 600; }
  .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }

  /* KPIs */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; min-width: 0; }
  .kpi .l { color: var(--muted); font-size: 11.5px; }
  .kpi .v { font-size: 18px; font-weight: 680; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .kpi .v small { font-size: 12px; color: var(--muted); font-weight: 500; }
  .kpi .s { color: var(--ink2); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 13px; }
  .kv span { color: var(--ink2); }
  .kv b { text-align: right; font-weight: 620; font-variant-numeric: tabular-nums; }
  .kv b small { color: var(--muted); font-weight: 400; margin-left: 4px; }
  .up { color: var(--good); } .down { color: var(--bad); }

  /* progress bar */
  .bar { height: 8px; border-radius: 4px; background: var(--line2); overflow: hidden; display: flex; gap: 2px; }
  .bar i { display: block; height: 100%; }
  .bar i:first-child { border-radius: 4px 0 0 4px; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--ink2); align-items: center; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .legend i.tick { height: 2px; width: 12px; background: var(--ink); vertical-align: 3px; }

  /* overview */
  .alerts { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .alert { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 9px; cursor: pointer; border: 1px solid var(--line); background: var(--card); }
  .alert b { font-size: 16px; }
  .alert.cross { border-color: #f0c6c2; background: var(--bad-bg); color: var(--bad); }
  .alert.near { border-color: #c9dcf5; background: var(--accent-wash); color: var(--accent-ink); }
  .alert.wrong { border-color: #f3dcb3; background: var(--warn-bg); color: var(--warn); }
  .alert.ok { color: var(--muted); cursor: default; }
  .acards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
  .acard { cursor: pointer; transition: box-shadow .15s; }
  .acard:hover { box-shadow: 0 4px 16px rgba(0,0,0,.06); }
  .acard .hd { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .acard .hd b { font-size: 17px; }
  .acard .hd .p { margin-left: auto; font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .acard .src { color: var(--muted); font-size: 11px; }
  .acard .lbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink2); margin: 9px 0 4px; }

  /* tables */
  .tw { overflow: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); }
  table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
  th { position: sticky; top: 0; background: #f3f2ee; color: var(--ink2); font-weight: 600; text-align: right; padding: 7px 9px; border-bottom: 1px solid var(--line); white-space: nowrap; z-index: 2; font-size: 12.5px; }
  td { padding: 5px 9px; text-align: right; border-bottom: 1px solid var(--line2); white-space: nowrap; }
  th.l, td.l { text-align: left; } th.c, td.c { text-align: center; }
  tbody tr:hover td { background: #fafaf7; }
  tr.r-filled td { background: var(--filled-bg) !important; color: #8a8984; }
  tr.r-filled td.px, tr.r-filled td.q { text-decoration: line-through; }
  tr.r-placed td { background: #f1fbf6; }
  tr.r-paused td { color: #a9a7a0; font-style: italic; }
  tr.r-pend td { background: var(--warn-bg) !important; }
  .kind { display: inline-block; margin-left: 4px; padding: 0 5px; border-radius: 5px; font-size: 10.5px; line-height: 16px; vertical-align: 1px; background: var(--plane); color: var(--muted); border: 1px solid var(--line); }
  .kind.k-swap { color: #4b3fa0; background: #eeebfb; border-color: #d6d0f3; }
  .kind.k-xfer { color: #6b6e74; }
  tr.sel td { background: var(--accent-wash) !important; }
  tr.grp td { background: #f7f6f2 !important; font-weight: 600; text-align: left; border-bottom: 1px solid var(--line); padding: 8px 9px; position: sticky; top: 33px; z-index: 1; }
  tr.grp .gs { font-weight: 400; color: var(--ink2); font-size: 12px; margin-left: 10px; }
  td input.in { height: 26px; width: 92px; text-align: right; padding: 0 6px; border: 1px solid transparent; background: transparent; border-radius: 5px; font-variant-numeric: tabular-nums; }
  td input.in:hover { border-color: var(--line); background: #fff; }
  td input.in:focus { border-color: var(--accent); background: #fff; }
  td input.note { width: 160px; text-align: left; }
  td input[type=checkbox], th input[type=checkbox] { width: 15px; height: 15px; cursor: pointer; }
  .tlink { cursor: pointer; color: var(--accent-ink); }
  .ibtn { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 14px; padding: 2px 5px; border-radius: 5px; }
  .ibtn:hover { background: var(--plane); color: var(--ink); }
  .pending { background: var(--plan-bg); color: var(--warn); padding: 1px 7px; border-radius: 9px; font-size: 11.5px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }

  /* batch bar */
  .batch { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 25; background: var(--ink); color: #fff;
    border-radius: 12px; padding: 8px 10px; display: flex; gap: 6px; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.25); flex-wrap: wrap; max-width: calc(100% - 20px); }
  .batch .btn { background: transparent; color: #fff; border-color: rgba(255,255,255,.25); }
  .batch .btn:hover { background: rgba(255,255,255,.12); }
  .batch .btn.primary { background: #fff; color: var(--ink); }
  .batch b { margin: 0 6px; }

  /* charts */
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; }
  .tip { position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--line); border-radius: 7px;
    box-shadow: 0 8px 22px rgba(0,0,0,.09); padding: 7px 10px; font-size: 12px; min-width: 176px; display: none; z-index: 5; }
  .tip .h { font-weight: 650; margin-bottom: 3px; }
  .tip .r { display: flex; justify-content: space-between; gap: 14px; color: var(--ink2); }
  .tip .r b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .donut { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .donut .lg { font-size: 12.5px; display: grid; gap: 4px; }
  .donut .lg div { display: flex; gap: 8px; justify-content: space-between; min-width: 170px; }
  .donut .lg b { font-variant-numeric: tabular-nums; font-weight: 600; }

  /* scenario */
  .scen { display: grid; grid-template-columns: auto 1fr 130px; gap: 10px; align-items: center; }
  .scen input[type=range] { width: 100%; accent-color: var(--accent); }
  .scen-out { font-size: 13px; color: var(--ink2); margin-top: 8px; }
  .scen-out b { color: var(--ink); }

  /* simulator */
  .sim { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 12px; align-items: start; }
  .simp { position: sticky; top: 66px; max-height: calc(100vh - 80px); overflow: auto; }
  .simp h3 { margin: 14px 0 8px; font-size: 11.5px; letter-spacing: .05em; color: var(--muted); font-weight: 650; }
  .simp h3:first-child { margin-top: 0; }
  .f { display: grid; grid-template-columns: 90px 1fr; align-items: center; gap: 6px 8px; margin-bottom: 6px; }
  .f > span { color: var(--ink2); font-size: 12.5px; }
  .f .u { display: flex; align-items: center; gap: 6px; }
  .f .u input { flex: 1; width: 100%; }
  .f .u em { font-style: normal; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .readout { background: var(--plane); border-radius: 7px; padding: 7px 9px; font-size: 12.5px; color: var(--ink2); margin: 4px 0 2px; }
  .readout b { color: var(--ink); }
  .chk { display: flex; gap: 8px; align-items: flex-start; margin: 7px 0; font-size: 12.5px; color: var(--ink2); cursor: pointer; }
  .chk input { margin-top: 3px; }
  tr.new td { background: #fffdf5; }
  tr.hl td { background: var(--accent-wash) !important; }
  td input.edited { border-color: var(--plan) !important; background: var(--plan-bg) !important; }

  /* modal & pop */
  .modal { position: fixed; inset: 0; background: rgba(20,20,20,.32); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 12px; }
  .modal.hidden { display: none; }
  .dlg { background: var(--card); border-radius: 12px; width: 520px; max-width: 100%; max-height: calc(100vh - 24px); overflow: auto; padding: 18px 20px; box-shadow: 0 20px 50px rgba(0,0,0,.2); }
  .dlg h3 { margin: 0 0 12px; font-size: 16px; }
  .dlg.wide { width: 860px; }
  .aiout { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; min-height: 80px; }
  .aiprog { margin-top: 10px; font-size: 13px; color: var(--ink2); }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .md { font-size: 13.5px; line-height: 1.65; color: var(--ink); }
  .md h2 { font-size: 15.5px; margin: 16px 0 6px; } .md h3 { font-size: 14px; margin: 14px 0 4px; } .md h4 { font-size: 13.5px; margin: 12px 0 4px; }
  .md p { margin: 6px 0; } .md ul, .md ol { margin: 6px 0; padding-left: 22px; } .md li { margin: 2px 0; }
  .md blockquote { margin: 8px 0; padding: 4px 12px; border-left: 3px solid var(--line); color: var(--ink2); }
  .md code { background: var(--plane); padding: 0 4px; border-radius: 4px; font-size: 12.5px; }
  .md table.mdt { font-size: 12.5px; } .md table.mdt td, .md table.mdt th { white-space: normal; }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
  .cite { color: var(--accent-ink); font-size: 10px; }
  .srcs { margin-top: 14px; font-size: 12px; color: var(--ink2); border-top: 1px solid var(--line); padding-top: 8px; }
  .srcs ol { margin: 4px 0 0; padding-left: 22px; } .srcs a { color: var(--accent-ink); word-break: break-all; }
  .aimeta { margin-bottom: 4px; }
  .dlg .foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
  .fg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  .fg label { display: grid; gap: 4px; font-size: 12.5px; color: var(--ink2); }
  .fg label.full { grid-column: 1 / -1; }
  .fg input, .fg select { width: 100%; }
  .note-box { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 9px 11px; font-size: 12.5px; margin: 8px 0; }
  .pop { position: absolute; z-index: 60; background: var(--card); border: 1px solid var(--line); border-radius: 9px; box-shadow: 0 10px 28px rgba(0,0,0,.14); padding: 5px; display: none; }
  .pop button { display: flex; width: 100%; border: 0; background: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; text-align: left; gap: 8px; align-items: center; }
  .pop button:hover { background: var(--plane); }
  .toast { position: fixed; left: 50%; bottom: 78px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 15px; border-radius: 9px; display: none; z-index: 70; max-width: 90%; font-size: 13px; }
  .toast.err { background: var(--bad); }
  .syncb { font-size: 12px; padding: 0 9px; white-space: nowrap; }
  .syncb.sb-ok { color: var(--good); }
  .syncb.sb-pend { color: var(--accent-ink); border-color: var(--accent); }
  .syncb.sb-busy { color: var(--muted); }
  .syncb.sb-warn { color: var(--warn); border-color: #e9b46a; background: var(--warn-bg); }
  .loading { position: fixed; top: 54px; left: 0; right: 0; height: 3px; z-index: 40; display: none; overflow: hidden; }
  .loading::after { content: ""; position: absolute; left: -30%; width: 30%; height: 100%; background: var(--accent); animation: ld 1s linear infinite; }
  @keyframes ld { to { left: 100%; } }
  .empty { padding: 34px; text-align: center; color: var(--muted); }
  .setup { max-width: 560px; margin: 60px auto; text-align: center; }

  .gchart { grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr); }
  .brand .en { font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: .02em; padding-top: 2px; }
  @media (max-width: 900px) {
    .gchart { grid-template-columns: 1fr; }
    .sim { grid-template-columns: 1fr; }
    .simp { position: static; max-height: none; }
    .g3, .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 640px) {
    header.top { height: auto; flex-wrap: wrap; padding: 8px 12px 6px; gap: 6px; }
    nav { order: 3; flex-basis: 100%; }
    .tools { margin-left: auto; }
    .tools .meta { display: none; }
    .tools { gap: 5px; }
    .tools select { max-width: 74px; padding-left: 6px; padding-right: 2px; }
    .syncb .sbl { display: none; }
    .brand .en { display: none; }
    main { padding: 12px 10px 100px; }
    .g2, .g3, .g4 { grid-template-columns: 1fr; }
    .scen { grid-template-columns: 1fr 110px; }
    .scen > span { grid-column: 1 / -1; }
    .fg { grid-template-columns: 1fr; }
    .loading { top: 0; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><i></i>資產買賣紀錄與掛單規劃本<span class="en">Asset Trade &amp; Ladder Planner</span></div>
  <nav id="nav">
    <button data-v="overview" class="on">總覽</button>
    <button data-v="orders">掛單簿</button>
    <button data-v="sim">模擬器</button>
    <button data-v="trades">掛單成交狀態</button>
    <button data-v="real">真實交易紀錄</button>
    <button data-v="settings">設定</button>
  </nav>
  <div class="tools">
    <span class="meta" id="meta"></span>

function logo(name, size) {
  size = size || 20;
  const a = A.am[name] || {}, u = a.logo || ICONS[String(name || '').toUpperCase()];

  const H = padT + H1 + GAP + H2 + padB, x0 = padL, pw = W - padL - padR, n = buckets.length, band = pw / n;
  const bw = Math.max(1.5, Math.min(26, band - Math.max(2, band * 0.22)));
  let cq = 0, cv = 0;
  buckets.forEach(b => { const q = b.f + b.p + b.n; cq += q; cv += q * b.price; b.cq = cq; b.cv = cv; b.tot = q + b.z; });
  const qMax = niceMax(Math.max(...buckets.map(b => Math.max(b.tot, b.ghost || 0))) * 1.08);
  const cMax = niceMax(cv * 1.05);
  const y1 = q => padT + H1 - q / qMax * H1, top2 = padT + H1 + GAP, y2 = c => top2 + H2 - c / cMax * H2;
  const u = esc(unitOf(o.asset)), sell = o.side === '賣';
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" font-size="11" font-family="inherit">`;
  for (let i = 0; i <= 4; i++) { const y = y1(qMax * i / 4); s += `<line x1="${x0}" x2="${W - padR}" y1="${y}" y2="${y}" stroke="${i ? '#e1e0d9' : '#c3c2b7'}"/><text x="${x0 - 7}" y="${y + 4}" text-anchor="end" fill="#898781">${i ? compact(qMax * i / 4) : '0'}</text>`; }
  for (let i = 0; i <= 2; i++) { const y = y2(cMax * i / 2); s += `<line x1="${x0}" x2="${W - padR}" y1="${y}" y2="${y}" stroke="${i ? '#e1e0d9' : '#c3c2b7'}"/><text x="${x0 - 7}" y="${y + 4}" text-anchor="end" fill="#898781">${i ? (SYM[ccyFor(o.asset)] || '$') + compact(cMax * i / 2) : '0'}</text>`; }
  s += `<text x="${x0 - padL + 4}" y="${padT - 12}" fill="#52514e" font-weight="600">每層數量（${u}）</text>`;
  s += `<text x="${x0 - padL + 4}" y="${top2 - 12}" fill="#52514e" font-weight="600">${sell ? '累計兌現' : '累計花費'}（${ccyFor(o.asset)}，不含暫停）</text>`;
  const segs = [['f', COL.filled], ['p', COL.placed], ['n', COL.plan], ['z', COL.paused]];
  buckets.forEach((b, i) => {
    const cx = x0 + band * (i + 0.5), x = cx - bw / 2;
    let acc = 0;
    const present = segs.filter(sg => b[sg[0]] > 0);
    present.forEach((sg, j) => {
      const yb = y1(acc), yt = y1(acc + b[sg[0]]);
      const last = j === present.length - 1;
      const hgt = Math.max(0, yb - yt - (last ? 0 : 1.5));
      s += last ? `<path d="${topRound(x, yb - hgt, bw, hgt, 3)}" fill="${sg[1]}"/>` : `<rect x="${x}" y="${yb - hgt}" width="${bw}" height="${hgt}" fill="${sg[1]}"/>`;
      acc += b[sg[0]];
    });
    if (b.ghost !== undefined && b.ghost !== null && Math.abs(b.ghost - b.tot) > 1e-9) {
      const gy = y1(b.ghost);
      s += `<line x1="${x - 1}" x2="${x + bw + 1}" y1="${gy}" y2="${gy}" stroke="#1f2328" stroke-width="2" stroke-linecap="round"/>`;
    }
  });
  let path = '';
  buckets.forEach((b, i) => { path += (i ? 'L' : 'M') + (x0 + band * (i + 0.5)).toFixed(1) + ',' + y2(b.cv).toFixed(1); });
  const fx = x0 + band * 0.5, lx = x0 + band * (n - 0.5);
  s += `<path d="${path}L${lx.toFixed(1)},${top2 + H2}L${fx.toFixed(1)},${top2 + H2}Z" fill="#2a78d6" opacity=".1"/><path d="${path}" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round"/>`;
  s += `<text x="${lx}" y="${y2(cv) - 7}" text-anchor="end" fill="#1c5cab" font-weight="600">${fusd(cv, o.asset)}</text>`;
  const every = Math.max(1, Math.ceil(n / Math.max(1, pw / (small ? 46 : 58))));
  buckets.forEach((b, i) => { if (i % every) return; s += `<text x="${x0 + band * (i + 0.5)}" y="${top2 + H2 + 16}" text-anchor="middle" fill="#898781">${compact(b.price)}</text>`; });
  const posOf = price => {
    if (!price) return null;
    const ps = buckets.map(b => b.price), asc = o.side !== '買';
    if (asc ? price < ps[0] : price > ps[0]) return { x: x0 + 1, e: 'l' };
    if (asc ? price > ps[n - 1] : price < ps[n - 1]) return { x: x0 + pw - 1, e: 'r' };
    for (let i = 0; i < n - 1; i++) {
      const a = ps[i], b = ps[i + 1];
      if ((asc && price >= a && price <= b) || (!asc && price <= a && price >= b)) return { x: x0 + band * (i + 0.5) + (price - a) / ((b - a) || 1) * band };
    }
    return { x: x0 + band * (n - 0.5) };
  };
  const mark = (price, color, label, yl) => {
    const p = posOf(price); if (!p) return '';
    const anc = p.e === 'r' ? 'end' : p.e === 'l' ? 'start' : 'middle';
    const tx = anc === 'end' ? p.x - 4 : anc === 'start' ? p.x + 4 : p.x;
    const txt = (p.e === 'l' ? '← ' : '') + label + ' ' + compact(price) + (p.e === 'r' ? ' →' : '');
    const bwid = txt.length * 6.6 + 8;
    const bx = anc === 'end' ? tx - bwid + 4 : anc === 'start' ? tx - 4 : tx - bwid / 2;
    return `<line x1="${p.x}" x2="${p.x}" y1="${padT - 4}" y2="${top2 + H2}" stroke="${color}" stroke-width="1.5"/>` +
      `<rect x="${bx}" y="${yl - 11}" width="${bwid}" height="16" rx="3" fill="#fff" opacity=".92"/>` +
      `<text x="${tx}" y="${yl + 1}" text-anchor="${anc}" fill="${color}" font-weight="600">${txt}</text>`;
  };
  s += mark(o.cur, '#1f2328', '現價', padT + 8);
  if (o.scen) s += mark(o.scen, '#1c5cab', '情境', padT + 26);
  buckets.forEach((b, i) => { s += `<rect class="hit" data-i="${i}" x="${x0 + band * i}" y="${padT}" width="${band}" height="${top2 + H2 - padT}" fill="transparent"/>`; });
  s += `<rect class="hb" x="0" y="${padT}" width="${band}" height="${top2 + H2 - padT}" fill="#2a78d6" opacity="0" pointer-events="none"/><circle class="hd" r="4" fill="#2a78d6" stroke="#fff" stroke-width="2" opacity="0" pointer-events="none"/></svg>`;
  host.innerHTML = s + '<div class="tip"></div>';
  const svg = host.querySelector('svg'), tip = host.querySelector('.tip'), hb = svg.querySelector('.hb'), hd = svg.querySelector('.hd');
  const show = i => {
    const b = buckets[i];
    hb.setAttribute('x', x0 + band * i); hb.setAttribute('opacity', '.07');
    hd.setAttribute('cx', x0 + band * (i + 0.5)); hd.setAttribute('cy', y2(b.cv)); hd.setAttribute('opacity', '1');
    const row = (l, v) => v ? `<div class="r"><span>${l}</span><b>${fq(v, o.asset)}</b></div>` : '';
    tip.innerHTML = `<div class="h">${fp(b.price, o.asset)} <span style="color:var(--muted);font-weight:400">${o.cur ? fpct(b.price / o.cur - 1) : ''}</span></div>` +
      row('已成交', b.f) + row((o.labels && o.labels.p) || '已掛單', b.p) + row((o.labels && o.labels.n) || '規劃', b.n) + row('暫停', b.z) +
      (b.ghost !== undefined && b.ghost !== null && Math.abs(b.ghost - b.tot) > 1e-9 ? `<div class="r"><span>目前掛單簿</span><b>${fq(b.ghost, o.asset)}</b></div>` : '') +
      `<div class="r"><span>價值</span><b>${fusd((b.f + b.p + b.n + b.z) * b.price, o.asset)}</b></div>` +
      `<div class="r"><span>${sell ? '漲到這裡累計賣出' : '跌到這裡累計買入'}</span><b>${fq(b.cq, o.asset)}</b></div>` +
      `<div class="r"><span>累計金額</span><b>${fusd(b.cv, o.asset)}</b></div>`;
    tip.style.display = 'block';
    const bx = (x0 + band * (i + 0.5)) / W * host.clientWidth;
    tip.style.left = Math.max(4, Math.min(host.clientWidth - tip.offsetWidth - 4, bx + 14)) + 'px';
    tip.style.top = '6px';
    if (o.onHover) o.onHover(i);
  };
  svg.querySelectorAll('.hit').forEach(el => {
    el.addEventListener('mouseenter', () => show(+el.dataset.i));
    el.addEventListener('click', () => { show(+el.dataset.i); if (o.onClick) o.onClick(+el.dataset.i); });
  });
  svg.addEventListener('mouseleave', () => { tip.style.display = 'none'; hb.setAttribute('opacity', '0'); hd.setAttribute('opacity', '0'); if (o.onHover) o.onHover(-1); });
}

// ── 狀態變更流程
function changeStatus(ids, status) {
  const os = A.s.orders.filter(o => ids.indexOf(o.id) >= 0 && o.status !== status);
  if (!os.length) return;
  if (status === ST.FILLED) return openFill(os.map(o => o.id));
  const withLog = os.filter(o => o.status === ST.FILLED && o.logId);
  if (withLog.length) {
    modal(`<h3>改回「${status}」</h3><p>${withLog.length} 張單原本是已成交，有對應的成交紀錄（${withLog.slice(0, 5).map(o => esc(o.logId)).join('、')}${withLog.length > 5 ? '…' : ''}）。</p>
      <p class="muted small">如果是誤標成交，請一起刪除成交紀錄；如果只是要讓這個價位再掛一次，建議改用「複製為新規劃單」，保留原本的成交。</p>
      <div class="foot"><button class="btn" data-m="close">取消</button><button class="btn" data-m="keep">改狀態，保留紀錄</button><button class="btn danger" data-m="del">改狀態並刪除紀錄</button></div>`, act => {

    return;

  call('api_setStatus', [os.map(o => o.id), status, {}], () => { toast(`已將 ${os.length} 張改為「${status}」`); render(); });
}

function simDefaults(S) {

/** 依目前的掛單估一組最接近的參數（價格區間、張數、間距、倍數、總量） */
function simFit(S) {

  let os = S.existing.filter(o => o.status === ST.PLAN || o.status === ST.PLACED), basis = '未成交';

  const pts = Object.keys(m).map(Number).sort((a, b) => sell ? a - b : b - a).map(p => ({ p: p, q: m[p] }));

  const cv = a => { const mu = mean(a); return mu ? Math.sqrt(mean(a.map(x => (x - mu) * (x - mu)))) / Math.abs(mu) : 0; };

  for (let i = 1; i < n; i++) { d.push(Math.abs(pts[i].p - pts[i - 1].p)); lr.push(Math.abs(Math.log(pts[i].p / pts[i - 1].p))); }

    case 'doneToggle': A.doneOpen = !A.doneOpen; render(); { const el = $('doneCard'); if (el && A.doneOpen) el.scrollIntoView({ block: 'nearest' }); } return;
    case 'doneAdd': return openDone(null);
    case 'doneEdit': return openDone(d.id);
    case 'realFollow': return call('api_saveHolding', [{ acct: A.acct, asset: d.asset, mode: '真實交易' }], () => { toast(`${d.asset} 的持倉改為跟隨真實交易紀錄`); render(); });
    case 'rfLog': A.rf.log = A.rf.log === false ? true : false; return realChart();
    case 'phRefresh': PH.cache[A.rf.asset] = null; PH.fail[A.rf.asset] = ''; LS.del(phKey(A.rf.asset)); phLoad(A.rf.asset, true); return realChart();
    case 'lkGo': return doUnlock();
    case 'acctLock': return lockNow(d.a);
    case 'acctPw': return openPassword(d.a);
    case 'realToHold': { const st = realStats(d.asset); return confirmBox(`更新 ${d.asset} 的持倉`, `把「設定 → 持倉」裡 ${esc(A.acct)} 的 ${esc(d.asset)} 基準持倉設為 <b>${fq(st.pos, d.asset)}</b>，基準時間＝現在。`, '更新', () => call('api_saveHolding', [{ acct: A.acct, asset: d.asset, qty: roundTo(st.pos, qdOf(d.asset)), time: Date.now() }], () => { toast('持倉已更新'); render(); })); }
    case 'rbConfirm': return call('api_confirmReal', [[...A.rsel]], () => { toast('已確認'); A.rsel.clear(); render(); });
    case 'rbDel': return confirmBox(`刪除 ${A.rsel.size} 筆真實交易`, '刪除後無法復原。', '刪除', () => call('api_deleteReal', [[...A.rsel]], () => { toast('已刪除'); A.rsel.clear(); render(); }));
    case 'rbClear': A.rsel.clear(); return render();
    case 'editTrade': return openTrade(d.id);
    case 'addTrade': return openTrade(null);
    case 'holdTime': return openHoldTime(d.acct, d.asset);
    case 'holdDel': return confirmBox(`移除 ${d.acct} ${d.asset} 的持倉列`, '只會移除持倉設定，不會影響掛單與成交紀錄。', '移除', () => call('api_deleteHolding', [d.acct, d.asset], () => render()));
    case 'holdAdd': {
      const q = num($('hQ').value);
      return call('api_saveHolding', [{ acct: $('hA').value, asset: $('hS').value, qty: q, time: q === null ? null : Date.now(), mode: $('hM').value }], () => { toast('已新增'); render(); });
    }
    case 'saveGen': return call('api_saveSettings', [{ alertPct: (num($('sAl').value) || 0) / 100, feeRate: (num($('sFee').value) || 0) / 100, defExch: $('sEx').value }], () => { toast('已儲存'); render(); });
    case 'saveNotes': return call('api_saveNotes', [A.acct, $('sNotes').value], () => toast(`「${A.acct}」的筆記已儲存`));
    case 'acctAdd': { const n = $('newAcct').value.trim(); if (!n) return toast('請輸入帳戶名稱', true); return call('api_addAccount', [n], () => { toast(`已新增帳戶「${n}」`); render(); }); }
    case 'acctUse': A.acct = d.a; setState(A.raw); if (A.sim) { A.sim.acct = A.acct; simLoad(); } return render();
    case 'acctRen': if (isLocked(d.a)) return toast('請先切換到該帳戶並輸入密碼', true); return acctRename(d.a);
    case 'acctDel': if (isLocked(d.a)) return toast('請先切換到該帳戶並輸入密碼', true); return acctDelete(d.a);
    case 'refresh': return call('api_refreshPrices', [], () => { toast('已更新現價'); render(); });
    case 'aiOpen': return openAi(A.acct, A.asset);
    case 'ordersPdf': return openOrdersPdf();
    case 'aiSave': { const k = $('aiKey').value.trim(); return call('api_saveAi', [{ key: k, model: $('aiModel').value, search: $('aiSearch').value === '1' }], () => { toast(k ? '已儲存 API Key 與 AI 設定' : '已儲存 AI 設定'); render(); }); }
    case 'aiClear': return confirmBox('移除 API Key', '移除後就不能使用 AI 診斷，直到重新填入。過去的診斷紀錄會保留。', '移除', () => call('api_saveAi', [{ clearKey: true }], () => { toast('已移除 API Key'); render(); }));
    case 'addAsset': { const tb = $('asBody'); tb.insertAdjacentHTML('beforeend', assetRow({ name: '', gf: '', cg: '', manual: null, qd: 4, pd: 2, ccy: 'USD', unit: '', logo: '', note: '' }, tb.children.length)); return; }
    case 'delAsset': { const tr = el.closest('tr'); const nm = tr.querySelector('[data-f=name]').value; if (A.s.orders.some(o => o.asset === nm)) return toast(`${nm} 還有掛單，不能移除`, true); tr.remove(); return; }
    case 'saveAssets': {
      const list = [...$('asBody').querySelectorAll('tr')].map(tr => { const g = f => tr.querySelector(`[data-f=${f}]`).value; return { name: g('name'), gf: g('gf'), cg: g('cg'), manual: g('manual'), qd: g('qd'), pd: g('pd'), ccy: g('ccy'), unit: g('unit'), logo: g('logo'), note: g('note') }; }).filter(a => a.name.trim());
      return call('api_saveAssets', [list], () => { toast('資產設定已儲存'); render(); });
    }
  }
});
document.addEventListener('change', e => {
  const el = e.target, act = el.dataset && el.dataset.act; if (!act) return;
  const d = el.dataset;
  switch (act) {
    case 'ofAsset': A.of.asset = el.value; return render();
    case 'ofHint': A.of.hint = el.value; return render();
    case 'tfAsset': A.tf.asset = el.value; return render();
    case 'rfAsset': A.rf.asset = el.value; return render();
    case 'rfYear': A.rf.year = el.value; return render();
    case 'rsel': if (el.checked) A.rsel.add(d.id); else A.rsel.delete(d.id); el.closest('tr').classList.toggle('sel', el.checked); return renderRealBatch();
    case 'rselAll': realList().forEach(t => { if (el.checked) A.rsel.add(t.id); else A.rsel.delete(t.id); }); return render();
    case 'sel': if (el.checked) A.sel.add(d.id); else A.sel.delete(d.id); el.closest('tr').classList.toggle('sel', el.checked); return renderBatch();
    case 'selAll': case 'selGrp': {
      A.s.orders.filter(o => visibleInOrders(o) && (act === 'selAll' || o.acct + '|' + o.asset + '|' + o.side === d.k))
        .forEach(o => { if (el.checked) A.sel.add(o.id); else A.sel.delete(o.id); });
      return render();
    }
    case 'note': return call('api_updateOrder', [d.id, { note: el.value }], () => toast('備註已儲存'), { silent: false });
    case 'holdQty': return call('api_saveHolding', [{ acct: d.acct, asset: d.asset, qty: el.value, time: Date.now() }], () => { toast('持倉已儲存，基準時間 = 現在'); render(); });
    case 'holdMode': return call('api_saveHolding', [{ acct: d.acct, asset: d.asset, mode: el.value }], () => { toast(el.value === '真實交易' ? '持倉改為跟隨真實交易紀錄' : '持倉改為手動'); render(); });
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.act === 'ofQ') { clearTimeout(el._t); el._t = setTimeout(() => { A.of.q = el.value; const pos = el.selectionStart; render(); const n = view().querySelector('[data-act=ofQ]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 250); }
});
function visibleInOrders(o) {
  const f = A.of, q = f.q.trim().toLowerCase();
  return inAcct(o) && (f.asset === '全部' || o.asset === f.asset) && (f.side === '全部' || o.side === f.side) && f.st[o.status] && (!f.hint || o.hint === f.hint) &&
    (!q || o.id.toLowerCase().indexOf(q) >= 0 || (o.note || '').toLowerCase().indexOf(q) >= 0 || String(o.price).indexOf(q) >= 0);
}
function goSim(acct, asset, side) {
  if (!acct) {
    const withOrders = A.s.settings.accounts.filter(a => A.s.orders.some(o => o.acct === a && o.asset === asset && o.side === side));
    acct = withOrders[0] || A.s.settings.accounts[0];
  }
  A.sim = { acct: acct, asset: asset, side: side };
  simLoad();
  go('sim');
}
let rz = null;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (A.view === 'asset' || A.view === 'sim') render(); }, 200); });

// 每 5 分鐘自動更新現價（畫面在前景、沒開視窗時）
setInterval(() => {
  if (document.visibilityState !== 'visible' || !$('modal').classList.contains('hidden') || !A.s || A.s.needsSetup) return;
  if (A.view === 'sim' || document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  call('api_load', [], () => render(), { silent: true });
}, 5 * 60 * 1000);

// 啟動
function boot() {
  if (!GAS) return bootPwa();
  busy(1);
  google.script.run.withSuccessHandler(s => {
    busy(-1);
    if (!s) return window.__bootErr('伺服器回傳了空的資料（api_load 回傳 null）。\n通常是資料裡有無法傳到網頁的格式。');
    try {
      if (s.needsSetup) { A.s = s; renderSetup(); window.__booted = true; return; }
      setState(s); render(); window.__booted = true;
    } catch (e) { window.__bootErr('畫面產生失敗：' + (e && e.message) + '\n' + String(e && e.stack || '').split('\n').slice(0, 4).join('\n') + '\n（版本 ' + (s.ver || '?') + '）'); }
  }).withFailureHandler(e => { busy(-1); window.__booted = true; view().innerHTML = `<div class="card setup"><h2>讀取失敗</h2><p>${esc(e && e.message ? e.message : e)}</p></div>`; }).api_load();
}
function bootPwa() {
  syncWire(); syncBadge();
  if (!SY.cfg) return renderConnect();
  if (SY.base && !SY.base.needsSetup) {
    // 先用這台裝置上的資料立刻畫出來，再到背景同步
    try { rebase(true); window.__booted = true; } catch (e) { window.__bootErr('畫面產生失敗：' + (e && e.message)); return; }
    syncRefresh(true).catch(() => {});
    return;
  }
  busy(1);
  syncRefresh(false).then(() => { busy(-1); window.__booted = true; }).catch(e => {
    busy(-1); window.__booted = true;
    if (e.auth) return;
    view().innerHTML = `<div class="card setup"><h2>連不到試算表</h2><p>${esc(e.message)}</p><p class="small muted">這台裝置還沒有資料，第一次需要連線下載。</p>
      <div class="foot" style="justify-content:center"><button class="btn" data-act="cfEdit">更改連線設定</button><button class="btn primary" data-act="cfRetry">重試</button></div></div>`;
  });
}
boot();
})();
</script>
</body>
</html>
